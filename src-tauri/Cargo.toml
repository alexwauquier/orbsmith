[package]
name = "orbsmith"
description = "Launches stand-in processes so desktop apps detect a game as running"
version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
name = "orbsmith_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4" }

[dependencies]
orbsmith-core = { path = "../crates/core" }
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-notification = "2.8"
tauri-plugin-single-instance = "2.5"
tokio = { version = "1", features = ["time"] }
