[package]
name = "orbsmith"
version = "0.1.0"
description = "Launches stand-in processes so desktop apps detect a game as running"
authors = ["Alex Wauquier"]
license = "MIT"
repository = "https://github.com/alexwauquier/orbsmith"
edition = "2024"
rust-version = "1.90"

[lib]
name = "orbsmith_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5" }
tauri-plugin-log = "2"
