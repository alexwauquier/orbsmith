name: Release

# Pushing a `v*` tag builds the Windows installers and attaches them to a
# draft GitHub release, once CI has passed for the tagged commit. Running the
# workflow by hand builds them as workflow artifacts only, without creating a
# release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci-passed:
    name: Check that CI passed for the tagged commit
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      actions: read # list the CI runs of the commit
    steps:
      # Waits while CI is still running for the commit, so the tag can be
      # pushed right after develop.
      - name: Wait for a successful CI run
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          for attempt in $(seq 1 40); do
            runs="$(gh api "repos/$GH_REPO/actions/workflows/ci.yml/runs?head_sha=$SHA&per_page=100")"
            passed="$(jq '[.workflow_runs[] | select(.conclusion == "success")] | length' <<< "$runs")"
            pending="$(jq '[.workflow_runs[] | select(.status != "completed")] | length' <<< "$runs")"
            if [ "$passed" -gt 0 ]; then
              echo "CI passed for $SHA."
              exit 0
            fi
            if [ "$pending" -eq 0 ]; then
              echo "::error::No successful CI run for $SHA. Push it to develop and let CI pass before tagging."
              exit 1
            fi
            echo "CI is still running for $SHA, checking again in 30 s ($attempt/40)."
            sleep 30
          done
          echo "::error::CI did not finish for $SHA within 20 minutes."
          exit 1

  windows:
    name: Build Windows installers
    needs: ci-passed
    # The check is skipped for manual runs, which create no release.
    if: ${{ !cancelled() && (needs.ci-passed.result == 'success' || needs.ci-passed.result == 'skipped') }}
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write # create the draft release and upload its assets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check that the tag matches the app version
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          status=0
          for version in \
            "$(node -p "require('./package.json').version")" \
            "$(node -p "require('./src-tauri/tauri.conf.json').version")" \
            "$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"; do
            if [ "v$version" != "$GITHUB_REF_NAME" ]; then
              echo "::error::tag $GITHUB_REF_NAME does not match version $version"
              status=1
            fi
          done
          exit "$status"

      # The release notes are the version's CHANGELOG.md section, without its
      # heading: only the types of changes and their entries.
      - name: Extract the release notes from the changelog
        id: notes
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          notes="$(awk -v heading="## [$version]" '
            index($0, heading) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found && /^\[[^]]+\]: / { next } # link references at the end of the file
            found { print }
          ' CHANGELOG.md | sed -e '/./,$!d' | sed -e ':a' -e '/^\n*$/{$d;N;ba' -e '}')"
          if [ -z "$notes" ]; then
            echo "::error::CHANGELOG.md has no entries for $version"
            exit 1
          fi
          {
            echo "body<<CHANGELOG_EOF"
            echo "$notes"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.16.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: ". -> target"

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Empty outside tag builds, so no release is created.
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: Orbsmith __VERSION__
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          uploadWorkflowArtifacts: true
